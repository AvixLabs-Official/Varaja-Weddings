<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0CA9F"/>
      <stop offset="50%" stop-color="#C5A46D"/>
      <stop offset="100%" stop-color="#9C7D46"/>
    </linearGradient>
  </defs>

  <!-- Background Circle (Deep Espresso #211C18) -->
  <circle cx="50" cy="50" r="46" fill="#211C18" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Minimal Rose Geometry in Champagne Gold -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Rose Outline -->
    <path d="M50 22 C34 22 24 34 24 50 C24 66 36 78 50 78 C64 78 76 66 76 50 C76 34 66 22 50 22 Z" opacity="0.4" stroke-dasharray="3 2"/>
    
    <!-- Rose Spiral Petals -->
    <path d="M50 28 C38 32 32 42 34 54 C36 64 46 70 56 68 C66 65 72 55 68 45 C65 37 57 32 48 35 C41 38 38 45 40 52 C42 57 47 60 52 59" stroke-width="2.8"/>

    <!-- Center Rose Heart -->
    <circle cx="50" cy="48" r="3.5" fill="url(#goldGrad)" stroke="none"/>
  </g>
</svg>
