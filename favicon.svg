<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D068"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8C6D2D"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Minimal Rose Petal Geometry -->
  <g fill="none" stroke="url(#blueGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Rose Petals -->
    <path d="M50 22 C34 22 24 34 24 50 C24 66 36 78 50 78 C64 78 76 66 76 50 C76 34 66 22 50 22 Z" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6"/>
    
    <!-- Rose Spiral Blossoms -->
    <path d="M50 28 C38 32 32 42 34 54 C36 64 46 70 56 68 C66 65 72 55 68 45 C65 37 57 32 48 35 C41 38 38 45 40 52 C42 57 47 60 52 59 C56 58 58 54 57 50" stroke="url(#blueGrad)" stroke-width="2.8"/>

    <!-- Center Rose Heart -->
    <circle cx="50" cy="48" r="3" fill="url(#goldGrad)" stroke="none"/>
  </g>
</svg>
