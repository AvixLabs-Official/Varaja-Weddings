<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D068"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8C6D2D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#121316" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Inner Royal Ring Accent -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6"/>

  <!-- Crown / Monogram V Motif -->
  <path d="M30 36 L50 72 L70 36 M50 28 L50 34 M38 32 L50 26 L62 32" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Small Sparkling Diamond Top -->
  <polygon points="50,20 53,24 50,28 47,24" fill="url(#goldGrad)"/>
</svg>
